name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Warn-level: the three hardcoded version strings must agree with each
      # other (no tag involved). release.yml hard-fails against the tag.
      - name: Version consistency check (warn-only)
        run: |
          SWIFT_VERSION=$(sed -n 's/.*version: "\([0-9][0-9.]*\)".*/\1/p' Sources/acuity/Acuity.swift | head -1)
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          MCP_VERSION=$(sed -n 's/.*"version": "\([0-9][0-9.]*\)".*/\1/p' mcp/server.py | head -1)
          echo "swift=$SWIFT_VERSION plist=$PLIST_VERSION mcp=$MCP_VERSION"
          if [ "$SWIFT_VERSION" != "$PLIST_VERSION" ] || [ "$SWIFT_VERSION" != "$MCP_VERSION" ]; then
            echo "::warning::Version strings disagree: Acuity.swift=$SWIFT_VERSION Info.plist=$PLIST_VERSION mcp/server.py=$MCP_VERSION — release.yml will hard-fail on the next tag"
          fi

      # Use runner's default Swift (matches system SDK)
      - name: Swift version
        run: swift --version

      # Cache SPM dependencies for faster builds
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: v2-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            v2-spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest pytests/ -q

  bundle:
    name: App Bundle
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: v2-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            v2-spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release binary
        run: swift build -c release

      - name: Assemble Acuity.app
        run: bash scripts/build-app.sh

      - name: Verify bundle structure
        run: |
          if [[ ! -d "build/Acuity.app" ]]; then
            echo "::error::build/Acuity.app not found"
            exit 1
          fi
          if [[ ! -f "build/Acuity.app/Contents/MacOS/acuity" ]]; then
            echo "::error::binary missing: build/Acuity.app/Contents/MacOS/acuity"
            exit 1
          fi
          if [[ ! -f "build/Acuity.app/Contents/Info.plist" ]]; then
            echo "::error::Info.plist missing from bundle"
            exit 1
          fi
          echo "✓ Acuity.app bundle structure verified"
          echo "  Binary: $(file build/Acuity.app/Contents/MacOS/acuity | cut -d: -f2)"
